name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**.md"]
  pull_request:
    paths-ignore: ["website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Use whichever Visual Studio the runner has (the presets name VS 2026 exactly):
      # load its x64 developer environment, then build with Ninja.
      - name: Developer environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the C++ tools on this runner." }
          Write-Host "Visual Studio: $vs"
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in "PATH", "INCLUDE", "LIB", "LIBPATH", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "UCRTVersion", "UniversalCRTSdkDir") {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    name: Android (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
      - name: Build and test
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: july-bangla-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
