name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**.md"]
  pull_request:
    paths-ignore: ["website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Uses whichever Visual Studio the runner has (the presets name VS 2026 exactly).
      - name: Build and test
        shell: pwsh
        run: ./tools/ci/Build-Arch.ps1 -Arch x64

  android:
    name: Android (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
      - name: Build and test
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: july-bangla-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
